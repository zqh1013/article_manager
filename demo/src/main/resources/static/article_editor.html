<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文章编辑</title>
  <!-- 引入wangEditor CSS -->
  <link href="https://unpkg.com/@wangeditor/editor@latest/dist/css/style.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f6fa;
    }
    .article-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      border-bottom: 1px solid #e8e8e8;
      padding-bottom: 16px;
    }
    .header h1 {
      margin: 0;
      color: #2d3436;
      font-size: 24px;
    }
    .button-group {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 8px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-draft {
      background: #f0f0f0;
      color: #666;
    }
    .btn-publish {
      background: #7c3aed;
      color: white;
    }
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .tags-input {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .tag {
      background: #f0f0f0;
      padding: 4px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag-remove {
      cursor: pointer;
      color: #999;
    }
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* 编辑器容器样式 */
    #editor-container {
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="article-container">
    <form id="articleForm">
      <!-- 头部 -->
      <div class="header">
        <h1>文章编辑</h1>
        <div class="button-group">
          <button type="button" class="btn btn-draft">保存草稿</button>
          <button type="submit" class="btn btn-publish">发布文章</button>
        </div>
      </div>

      <!-- 标题 -->
      <div class="form-group">
        <label>文章标题</label>
        <input type="text" id="title" placeholder="请输入标题" required>
      </div>

      <!-- 分类 -->
      <div class="form-group">
        <label>文章分类</label>
        <select id="categorySelect">
          <option value="">请选择分类</option>
        </select>
      </div>

      <!-- 标签 -->
      <div class="form-group">
        <label>标签（按回车添加）</label>
        <div class="tags-input">
          <input type="text" placeholder="输入标签后按回车" style="border: none; outline: none; flex-grow: 1;">
        </div>
      </div>

      <!-- 富文本编辑器 -->
      <div class="form-group">
        <label>内容编辑</label>
        <div id="editor-container"></div>
      </div>

      <!-- 共享设置 -->
      <div class="form-group">
        <label>共享设置</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="visibility" value="private" checked>
            私密文章（仅自己可见）
          </label>
          <label>
            <input type="radio" name="visibility" value="public">
            公开共享（所有人可见）
          </label>
        </div>
      </div>
    </form>
  </div>

  <!-- 引入wangEditor JS -->
  <script src="https://cdn.jsdelivr.net/npm/@wangeditor/editor@latest/dist/index.js"></script>
  <script src="js/article_editor.js"></script>

</body>
</html>
